name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: bash test-app.sh
      - name: Build universal macOS app
        run: bash build-app.sh
      - name: Test Rust CLI
        run: cargo test --locked
      - name: Build Rust CLI
        run: cargo build --release --locked
